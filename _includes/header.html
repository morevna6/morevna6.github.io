<header class="site-header">

  <!-- Hero Section -->
  <div
    class="hero-section"
    style="
      background:
        linear-gradient(
          rgba(26, 26, 26, 0.6),
          rgba(26, 26, 26, 0.4)
        ),
        url('{{ '/assets/images/background.jpg' | relative_url }}');
      background-size: cover;
      background-position: center;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    "
  >
    <h1
      class="site-title"
      style="
        color: #ffffff;
        font-size: 2rem;
        line-height: 1.3;
        text-align: center;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
        position: relative;
        z-index: 2;
        margin: 0;
        padding: 1rem 2rem;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 8px;
      "
    >
      {{ site.title | escape }}
    </h1>
  </div>

  <!-- Main Navigation -->
  <nav class="main-nav" aria-label="Main navigation">
    <div class="nav-container">

      <!-- Mobile Menu Button -->
      <button
        class="mobile-menu-button"
        type="button"
        aria-expanded="false"
        aria-controls="primary-navigation"
      >
        <span class="mobile-menu-icon" aria-hidden="true">☰</span>
        <span>Menu</span>
      </button>

      <!-- Navigation Items -->
      <ul class="nav-menu" id="primary-navigation">

        {% for item in site.navigation %}

          <li
            class="
              nav-item
              {% if item.children %}has-dropdown{% endif %}
            "
          >

            {% if item.children %}

              <!-- Dropdown Parent -->
              <button
                class="nav-link dropdown-toggle"
                type="button"
                aria-expanded="false"
                aria-haspopup="true"
              >
                <span>{{ item.title | escape }}</span>

                <span
                  class="dropdown-arrow"
                  aria-hidden="true"
                >
                  ▾
                </span>
              </button>

            {% else %}

              <!-- Normal Navigation Link -->
              <a
                class="
                  nav-link
                  {% if page.url == item.url %}active{% endif %}
                "
                href="{{ item.url | relative_url }}"
                {% if page.url == item.url %}
                  aria-current="page"
                {% endif %}
              >
                {{ item.title | escape }}
              </a>

            {% endif %}

            {% if item.children %}

              <!-- Dropdown Menu -->
              <ul
                class="dropdown-menu"
                aria-label="{{ item.title | escape }} submenu"
              >

                {% for child in item.children %}

                  <li class="dropdown-item">
                    <a
                      class="
                        dropdown-link
                        {% if page.url == child.url %}active{% endif %}
                      "
                      href="{{ child.url | relative_url }}"
                      {% if page.url == child.url %}
                        aria-current="page"
                      {% endif %}
                    >
                      {{ child.title | escape }}
                    </a>
                  </li>

                {% endfor %}

              </ul>

            {% endif %}

          </li>

        {% endfor %}

      </ul>

    </div>
  </nav>

</header>

<style>
  /*
   * Hero section
   */

  .hero-section {
    min-height: 300px;
  }

  .site-title {
    max-width: 1000px;
  }

  /*
   * Mobile hero adjustments only.
   * Navigation styling belongs in assets/css/style.scss.
   */

  @media (max-width: 768px) {
    .hero-section {
      min-height: 200px !important;
      padding: 1rem;
    }

    .site-title {
      font-size: 1.5rem !important;
      padding: 0.75rem 1rem !important;
    }
  }
</style>
